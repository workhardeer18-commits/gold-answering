<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم اطلاعات کاربر</title>
    <style>
    /* تنظیم فونت کلی برای تمام المان‌ها */
    *, *::before, *::after {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }

    body { 
        margin: 0; 
        background: #0b0c10; 
        color: #fff; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh;
        line-height: 1.6;
    }

    .form-card {
        background: #10131b;
        width: 100%;
        max-width: 400px;
        padding: 40px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

     .form-card h2 {
        text-align: center;
        color: #f0c36b;
        margin-top: 0;
        margin-bottom: 30px;
        font-size: 1.5rem;
        font-weight: 600 !important; /* وزن فونت استاندارد */
        letter-spacing: -0.5px;
    }

    /* استایل فیلدهای جنگو */
    form p { margin-bottom: 20px; }
    
    label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.6);
        padding-right: 5px;
    }

    input, select, textarea {
        width: 100%;
        height: 50px;
        background: #1a1d26;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 0 15px;
        color: #fff;
        font-size: 1rem;
        transition: 0.3s;
        box-sizing: border-box;
    }

    input:focus {
        outline: none;
        border-color: #f0c36b;
        background: #1f222d;
    }

    /* دکمه‌ها */
    .button-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 30px;
    }

    button[type="submit"] {
        height: 55px;
        background: #f0c36b;
        color: #0b0c10;
        border: none;
        border-radius: 15px;
        font-weight: 600;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(240, 195, 107, 0.2);
    }

    .btn-cancel {
        text-align: center;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.9rem;
        padding: 10px;
        transition: 0.3s;
    }

    .btn-cancel:hover {
        color: #ff4d4d;
    }

    .errorlist {
        color: #ff4d4d;
        list-style: none;
        padding: 0;
        font-size: 0.8rem;
        margin-top: 5px;
    }
    
    
        /* Alerts */
        .custom-alert { padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .alert-success { background: rgba(76, 175, 80, 0.1); color: #4caf50; border: 1px solid #4caf50; }
        .alert-error { background: rgba(229, 57, 53, 0.1); color: #e53935; border: 1px solid #e53935; }
        .alert-close { background: none; border: none; color: inherit; font-size: 20px; cursor: pointer; }

    
    
    
</style>

   

</head>
<body>



<div class="form-card">
    
     {% if messages %}
        {% for message in messages %}
            <div class="custom-alert {% if message.tags == 'success' %}alert-success{% elif message.tags == 'error' %}alert-error{% else %}alert-info{% endif %}">
                <span>{{ message }}</span>
                <button class="alert-close" onclick="this.parentElement.style.display='none'">×</button>
            </div>
        {% endfor %}
    {% endif %}
    <h2 style="font-family: inherit !important;"> اطلاعات کاربر</h2>
    
    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}

        <div class="button-group">
            <button type="submit">ذخیره تغییرات</button>
            <a href="{% url 'admin_users' %}" class="btn-cancel">انصراف و بازگشت</a>
        </div>
    </form>
</div>

</body>
</html>
