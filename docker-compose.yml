version: "3.9"

services:

  postgres-gold:
    image: postgres:15-alpine
    container_name: postgres-gold
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_gold_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: django_web
    command: ./deploy.sh web
    volumes:
      - .:/app
      - staticfiles:/app/gold/staticfiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres-gold
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_gold
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
    depends_on:
      - web
    restart: always


volumes:
  postgres_gold_data:
  staticfiles:
