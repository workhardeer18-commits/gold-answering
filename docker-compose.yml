version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

#  redis:
#    image: redis:7-alpine
#    container_name: redis
#    restart: always
#    ports:
#      - "6379:6379"

  web:
    build: .
    container_name: django_web
    command: ./deploy.sh web
    volumes:
      - .:/app
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always

